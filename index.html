<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIS After-School Programs</title>
<meta charset="utf-8">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* School colours, taken from the logo and the group-chat badges */
  :root { --blue: #1f6ea8; --navy: #182f63; --orange: #f5650f; --ink: #1b2b4b; --muted: #55657f; --line: #d5deea; --soft: #eaf2fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', 'Noto Sans Lao', 'Phetsarath OT', -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--ink);
         background: #f3f6fa; overflow-x: hidden; }
  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  /* Full-width blue band behind the logo; the white panel overlaps its bottom edge */
  .top { text-align: center; background: linear-gradient(180deg, var(--navy), var(--blue));
         margin: -16px calc(50% - 50vw) -36px; padding: 16px calc(50vw - 50% + 0px) 50px; }
  .panel { position: relative; }
  .top img { width: 72px; height: 72px; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .top.big img { width: 132px; height: 132px; }
  .top .school { color: #fff; font-weight: 800; letter-spacing: .5px; font-size: 14px; margin-top: 6px; text-transform: uppercase; }
  .panel { background: #fff; border-radius: 20px; padding: 18px 16px 20px; box-shadow: 0 6px 24px rgba(24,47,99,.10); }
  h1 { font-size: 23px; line-height: 1.35; text-align: center; margin: 4px 0 8px; color: var(--navy); font-weight: 800; }
  h2 { font-size: 20px; margin: 14px 0 10px; color: var(--navy); font-weight: 800; }
  p.sub { text-align: center; margin: 0 0 18px; color: var(--muted); }
  .btn { display: block; width: 100%; padding: 16px; margin: 12px 0; font-size: 18px; font-weight: 700; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font-family: inherit; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .btn.alt { background: #fff; color: var(--blue); border: 2px solid var(--blue); box-shadow: none; }
  .btn.orange { background: var(--orange); }
  .btn:disabled { opacity: .5; }
  .btn.big { padding: 24px; font-size: 24px; }
  label { display: block; font-weight: 700; margin: 16px 0 6px; }
  input[type=text], input[type=tel] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--line); border-radius: 12px; font-family: inherit; background: #fbfdff; }
  input:focus { outline: none; border-color: var(--blue); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { padding: 16px 8px; font-size: 18px; font-weight: 700; background: #fff; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); font-family: inherit; text-align: center; }
  .tile.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px; margin: 10px 0; background: #fff; border: 2px solid var(--line); border-radius: 16px; font-family: inherit; color: var(--ink); font-size: 17px; }
  .card.on { border-color: var(--blue); background: var(--soft); }
  .card img { width: 68px; height: 68px; border-radius: 50%; flex: none; }
  .card.small img { width: 44px; height: 44px; }
  .card .txt { flex: 1; min-width: 0; }
  .card b { display: block; font-size: 19px; }
  .card span { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .card .tick { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; margin: 0; }
  .card.on .tick { background: var(--blue); border-color: var(--blue); }
  .note { background: #fff1e6; border-left: 4px solid var(--orange); border-radius: 10px; padding: 10px 12px; margin: 14px 0; font-size: 15px; }
  .err { color: #c0302b; font-weight: 700; margin: 10px 0; }
  .sum { display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 14px; padding: 12px; margin: 10px 0; border: 2px solid var(--line); }
  .sum .imgs { display: flex; flex-wrap: wrap; gap: 4px; width: 92px; flex: none; }
  .sum .imgs img { width: 44px; height: 44px; border-radius: 50%; }
  .sum .txt { flex: 1; }
  .sum b { font-size: 18px; }
  .back { background: none; border: 0; color: #fff; font-size: 16px; padding: 6px 0; font-family: inherit; font-weight: 700; }
  .x { background: none; border: 0; color: #c0302b; font-size: 22px; padding: 0 4px; font-family: inherit; }
  .done { text-align: center; padding: 20px 0 10px; }
  .done .big { width: 72px; height: 72px; line-height: 72px; margin: 0 auto 6px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 40px; }
  .badges { display: flex; justify-content: center; gap: 8px; margin: 18px 0 4px; }
  .badges img { width: 54px; height: 54px; border-radius: 50%; }
</style>
</head>
<body>
<div id="app"><p style="padding:20px;font-size:18px">Loading...</p></div>
<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFPCTl119Npv4VI2HH2B2O74wlb62y2bJhRp4gHjDsXpR-omU-3IHyzzcpA91t7Wxi2w/exec';
window.onerror = function (m, u, l) { document.getElementById('app').innerHTML = '<p style=color:#c0302b;padding:20px>Page error: ' + m + ' (line ' + l + ')</p>'; };
var GRADES = [
  { en: 'Pre-K', lo: 'ອະນຸບານ 2' }, { en: 'Kinder', lo: 'ອະນຸບານ 3' },
  { en: 'Grade 1', lo: 'ຫ້ອງ ປ.1' }, { en: 'Grade 2', lo: 'ຫ້ອງ ປ.2' }, { en: 'Grade 3', lo: 'ຫ້ອງ ປ.3' },
  { en: 'Grade 4', lo: 'ຫ້ອງ ປ.4' }, { en: 'Grade 5', lo: 'ຫ້ອງ ປ.5' }
];

var DAYS = {
  tuthu: { en: 'Tuesday & Thursday', lo: 'ວັນອັງຄານ ແລະ ວັນພະຫັດ' },
  monwed: { en: 'Monday & Wednesday', lo: 'ວັນຈັນ ແລະ ວັນພຸດ' }
};

// grades: [first, last] as positions in GRADES (0 = Pre-K, 1 = Kinder, 2 = Grade 1 ... 6 = Grade 5).
var ACTS = [
  { id: 'sb', en: 'Soccer (boys)', lo: 'ເຕະບານ (ເດັກຊາຍ)', days: 'tuthu', price: 'free', grades: [4, 6], img: 'soccer' },
  { id: 'sg', en: 'Soccer (girls)', lo: 'ເຕະບານ (ເດັກຍິງ)', days: 'monwed', price: 'free', grades: [4, 6], img: 'soccer' },
  { id: 'ch', en: 'Chinese', lo: 'ພາສາຈີນ', days: 'tuthu', price: '3,500', grades: [1, 6], img: 'chinese', age: { en: 'Ages 5-12', lo: 'ອາຍຸ 5-12 ປີ' } },
  { id: 'lo', en: 'Lao Language', lo: 'ພາສາລາວ', days: 'tuthu', price: '3,200', grades: [1, 6], img: 'lao' },
  { id: 'sw', en: 'Swimming', lo: 'ລອຍນ້ຳ', days: 'swim', price: '4,200', grades: [0, 4], img: 'swimming' }
];
function actImg(a) { return '<img src="img/' + a.img + '.jpg" alt="">'; }

// Logo header on every screen, with an optional back button, then the white panel.
function frame(backTo, content, big) {
  return '<div class="top' + (big ? ' big' : '') + '">' +
         '<div style="position:relative">' +
         (backTo >= 0 ? '<button class="back" style="position:absolute;left:0;top:0" onclick="go(' + backTo + ')">← ' + t('back') + '</button>' : '') +
         '<img src="img/logo.png" alt="Diamond International School">' +
         '<div class="school">Diamond International School</div></div></div>' +
         '<div class="panel">' + content + '</div>';
}

var T = {
  en: {
    title: 'After-School Programs',
    parentTitle: 'Your details',
    pname: 'Your name', pcontact: 'Phone or WhatsApp number',
    next: 'Next', back: 'Back',
    gradeQ: 'What grade is your child in?', cname: 'Child’s name',
    actQ: 'Which activities is your child interested in?', actHint: 'Tap all that apply. All programs run 4:00-5:00 PM.',
    firstQ: 'Which one is your first choice?',
    clash: 'Some of your choices are on the same days, so please pick a first choice.',
    review: 'Your children', addChild: '+ Add another child', send: 'Send',
    sending: 'Sending...', thanks: 'Thank you!', thanks2: 'We have received your reply and will be in touch soon.',
    errName: 'Please fill in your name and phone number.',
    errChild: 'Please choose a grade and enter your child’s name.',
    errAct: 'Please choose at least one activity.',
    errFirst: 'Please choose a first choice.',
    errSend: 'Something went wrong. Please try again.',
    free: 'Some fees may apply', perMonth: 'THB/month', start: 'Starts Nov 2',
    interested: 'Interested in', first: 'First choice', ordinal: ''
  },
  lo: {
    title: 'ໂປຣແກຣມຮຽນເພີ່ມຫຼັງເລີກຮຽນ',
    parentTitle: 'ຂໍ້ມູນຂອງທ່ານ',
    pname: 'ຊື່ຂອງທ່ານ', pcontact: 'ເບີໂທ ຫຼື ເບີ WhatsApp',
    next: 'ຕໍ່ໄປ', back: 'ກັບຄືນ',
    gradeQ: 'ລູກຂອງທ່ານຮຽນຫ້ອງໃດ?', cname: 'ຊື່ຂອງລູກທ່ານ',
    actQ: 'ລູກຂອງທ່ານສົນໃຈກິດຈະກຳໃດ?', actHint: 'ກົດເລືອກໄດ້ຫຼາຍອັນ. ທຸກກິດຈະກຳ 4:00-5:00 ໂມງແລງ.',
    firstQ: 'ເລືອກອັນໃດເປັນອັນດັບ 1?',
    clash: 'ບາງກິດຈະກຳທີ່ທ່ານເລືອກຢູ່ວັນດຽວກັນ, ກະລຸນາເລືອກອັນດັບ 1.',
    review: 'ລູກຂອງທ່ານ', addChild: '+ ເພີ່ມລູກອີກຄົນ', send: 'ສົ່ງ',
    sending: 'ກຳລັງສົ່ງ...', thanks: 'ຂອບໃຈ!', thanks2: 'ພວກເຮົາໄດ້ຮັບຂໍ້ມູນຂອງທ່ານແລ້ວ ແລະ ຈະຕິດຕໍ່ກັບໄປໄວໆນີ້.',
    errName: 'ກະລຸນາຕື່ມຊື່ ແລະ ເບີໂທຂອງທ່ານ.',
    errChild: 'ກະລຸນາເລືອກຊັ້ນ ແລະ ຕື່ມຊື່ນັກຮຽນ.',
    errAct: 'ກະລຸນາເລືອກຢ່າງໜ້ອຍໜຶ່ງກິດຈະກຳ.',
    errFirst: 'ກະລຸນາເລືອກທາງເລືອກອັນດັບ 1.',
    errSend: 'ມີບັນຫາ, ກະລຸນາລອງໃໝ່.',
    free: 'ອາດມີຄ່າທຳນຽມບາງຢ່າງ', perMonth: 'ບາດ/ເດືອນ', start: 'ເລີ່ມ 2 ພະຈິກ',
    interested: 'ສົນໃຈ', first: 'ທາງເລືອກອັນດັບໜຶ່ງ', ordinal: ''
  }
};

var S = { step: 0, lang: 'en', parent: '', contact: '', children: [], cur: { grade: -1, name: '', acts: [], first: '' }, err: '' };

function t(k) { return T[S.lang][k]; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function actById(id) { return ACTS.filter(function (a) { return a.id === id; })[0]; }
function gradeLabel(i) { return GRADES[i][S.lang]; }

function swimDays(g) { return g <= 1 ? 'monwed' : (g <= 4 ? 'tuthu' : null); }
function available(g) {
  return ACTS.filter(function (a) { return g >= a.grades[0] && g <= a.grades[1]; });
}
function dayKey(a, g) { return a.id === 'sw' ? swimDays(g) : a.days; }
function daysFor(a, g) { return DAYS[dayKey(a, g)][S.lang]; }
// Chosen activities that share their days with another chosen activity. Only these need a first choice.
function clashing() {
  var g = S.cur.grade;
  return S.cur.acts.filter(function (id) {
    return S.cur.acts.some(function (o) { return o !== id && dayKey(actById(o), g) === dayKey(actById(id), g); });
  });
}

function go(step) { S.step = step; S.err = ''; render(); window.scrollTo(0, 0); }

function setLang(l) { S.lang = l; go(1); }

function nextParent() {
  S.parent = document.getElementById('pn').value.trim();
  S.contact = document.getElementById('pc').value.trim();
  if (!S.parent || !S.contact) { S.err = t('errName'); render(); return; }
  go(2);
}

function pickGrade(i) {
  var n = document.getElementById('cn'); if (n) S.cur.name = n.value;
  S.cur.grade = i; S.cur.acts = []; S.cur.first = '';
  render();
}

function nextChild() {
  S.cur.name = document.getElementById('cn').value.trim();
  if (S.cur.grade < 0 || !S.cur.name) { S.err = t('errChild'); render(); return; }
  go(3);
}

function toggleAct(id) {
  var i = S.cur.acts.indexOf(id);
  if (i >= 0) S.cur.acts.splice(i, 1); else S.cur.acts.push(id);
  if (clashing().indexOf(S.cur.first) < 0) S.cur.first = '';
  render();
}

function pickFirst(id) { S.cur.first = id; render(); }

function saveChild() {
  if (!S.cur.acts.length) { S.err = t('errAct'); render(); return; }
  if (clashing().length && !S.cur.first) { S.err = t('errFirst'); render(); return; }
  S.children.push({ grade: S.cur.grade, name: S.cur.name, acts: S.cur.acts.slice(), first: S.cur.first });
  go(4);
}

function addChild() {
  S.cur = { grade: -1, name: '', acts: [], first: '' };
  go(2);
}

function dropChild(i) {
  S.children.splice(i, 1);
  if (!S.children.length) { addChild(); return; }
  render();
}

function sendAll() {
  var btn = document.getElementById('sendbtn');
  btn.disabled = true; btn.textContent = t('sending');
  // One row per child. The keys are the sheet's column names; a new key becomes a new column automatically.
  var payload = {
    rows: S.children.map(function (c) {
      return {
        'Language': S.lang === 'lo' ? 'Lao' : 'English',
        'Parent name': S.parent,
        'Phone / WhatsApp': S.contact,
        'Child name': c.name,
        'Grade': GRADES[c.grade].en,
        'Interested in': c.acts.map(function (id) { return actById(id).en; }).join(', '),
        'First choice': c.first ? actById(c.first).en : '',
        'Children in family': S.children.length
      };
    })
  };
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok) { go(5); } else { throw new Error('save failed'); } })
    .catch(function () { S.err = t('errSend'); render(); });
}

function render() {
  var h = '';
  var err = S.err ? '<div class="err">' + esc(S.err) + '</div>' : '';

  if (S.step === 0) {
    h = '<h1>After-School Programs<br>ໂປຣແກຣມຮຽນເພີ່ມຫຼັງເລີກຮຽນ</h1>' +
        '<div class="badges">' + ['soccer', 'chinese', 'lao', 'swimming'].map(function (n) { return '<img src="img/' + n + '.jpg" alt="">'; }).join('') + '</div>' +
        '<p class="sub">Choose your language · ເລືອກພາສາ</p>' +
        '<button class="btn big" onclick="setLang(\'en\')">English</button>' +
        '<button class="btn big orange" onclick="setLang(\'lo\')">ພາສາລາວ</button>';
    h = frame(-1, h, true);
  }

  else if (S.step === 1) {
    h = '<h1>' + t('title') + '</h1><h2>' + t('parentTitle') + '</h2>' +
        '<label>' + t('pname') + '</label><input type="text" id="pn" value="' + esc(S.parent) + '">' +
        '<label>' + t('pcontact') + '</label><input type="tel" id="pc" value="' + esc(S.contact) + '">' +
        err + '<button class="btn" onclick="nextParent()">' + t('next') + '</button>';
    h = frame(0, h);
  }

  else if (S.step === 2) {
    h = '<h2>' + t('gradeQ') + '</h2><div class="grid">';
    for (var i = 0; i < GRADES.length; i++) {
      h += '<button class="tile' + (S.cur.grade === i ? ' on' : '') + '" onclick="pickGrade(' + i + ')">' + esc(gradeLabel(i)) + '</button>';
    }
    h += '</div><label>' + t('cname') + '</label><input type="text" id="cn" value="' + esc(S.cur.name) + '">' +
         err + '<button class="btn" onclick="nextChild()">' + t('next') + '</button>';
    h = frame(S.children.length ? 4 : 1, h);
  }

  else if (S.step === 3) {
    h = '<h2>' + t('actQ') + '</h2><p class="sub" style="text-align:left;margin-bottom:6px">' + esc(S.cur.name) + ' · ' + esc(gradeLabel(S.cur.grade)) + '</p>' +
        '<p style="margin-top:0">' + t('actHint') + '</p>';
    available(S.cur.grade).forEach(function (a) {
      var on = S.cur.acts.indexOf(a.id) >= 0;
      var price = a.price === 'free' ? t('free') : a.price + ' ' + t('perMonth');
      var extra = a.age ? ' · ' + a.age[S.lang] : '';
      var start = a.id === 'lo' ? ' · ' + t('start') : '';
      h += '<button class="card' + (on ? ' on' : '') + '" onclick="toggleAct(\'' + a.id + '\')">' + actImg(a) +
           '<div class="txt"><b>' + esc(a[S.lang]) + '</b>' +
           '<span>' + daysFor(a, S.cur.grade) + extra + '</span>' +
           '<span>' + price + start + '</span></div>' +
           '<span class="tick">' + (on ? '✓' : '') + '</span></button>';
    });
    if (clashing().length) {
      h += '<div class="note">' + t('clash') + '</div><h2>' + t('firstQ') + '</h2>';
      clashing().forEach(function (id) {
        var a = actById(id), on = S.cur.first === id;
        h += '<button class="card small' + (on ? ' on' : '') + '" onclick="pickFirst(\'' + id + '\')">' + actImg(a) +
             '<div class="txt"><b>' + esc(a[S.lang]) + '</b></div><span class="tick">' + (on ? '★' : '') + '</span></button>';
      });
    }
    h += err + '<button class="btn" onclick="saveChild()">' + t('next') + '</button>';
    h = frame(2, h);
  }

  else if (S.step === 4) {
    h = '<h2>' + t('review') + '</h2>';
    S.children.forEach(function (c, i) {
      h += '<div class="sum"><div class="imgs">' + c.acts.map(function (id) { return actImg(actById(id)); }).join('') + '</div>' +
           '<div class="txt"><b>' + esc(c.name) + '</b> · ' + esc(gradeLabel(c.grade)) + '<br>' +
           t('interested') + ': ' + c.acts.map(function (id) { return esc(actById(id)[S.lang]); }).join(', ') +
           (c.first ? '<br>' + t('first') + ': ★ ' + esc(actById(c.first)[S.lang]) : '') + '</div>' +
           '<button class="x" onclick="dropChild(' + i + ')" aria-label="Remove">✕</button></div>';
    });
    h += err + '<button class="btn alt" onclick="addChild()">' + t('addChild') + '</button>' +
         '<button class="btn orange" id="sendbtn" onclick="sendAll()">' + t('send') + '</button>';
    h = frame(-1, h);
  }

  else {
    h = frame(-1, '<div class="done"><div class="big">✓</div><h1>' + t('thanks') + '</h1><p>' + t('thanks2') + '</p>' +
        '<div class="badges">' + ['soccer', 'chinese', 'lao', 'swimming'].map(function (n) { return '<img src="img/' + n + '.jpg" alt="">'; }).join('') + '</div></div>', true);
  }

  document.getElementById('app').innerHTML = h;
}

render();
</script>
</body>
</html>
